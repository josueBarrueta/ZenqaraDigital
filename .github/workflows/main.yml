name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: paginaZenqara/package-lock.json

      - name: Instalar dependencias
        working-directory: paginaZenqara
        run: npm ci

      - name: Compilar Angular
        working-directory: paginaZenqara
        run: npm run build -- --base-href /ZenqaraDigital/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir web compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: paginaZenqara/dist/paginaZenqara/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
